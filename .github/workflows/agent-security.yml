name: Agent Security Scan

# AgentShield static scan — 102 правила, БЕЗ API-ключа.
# Action закреплён по immutable SHA и блокирует High/Critical findings.
# Опциональный Opus-deep-scan требует ANTHROPIC_API_KEY — запускать локально
# через scripts/agent-security-scan.ps1 -Opus.
# Runbook: .claude/SECURITY-TOOLING.md

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.claude/**'

permissions:
  contents: read

jobs:
  agentshield:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: AgentShield static scan
        uses: affaan-m/agentshield@9bbc007cf5afb562c324bbad4ce6c544420f49f6 # v1.4.0
        with:
          path: '.claude'
          min-severity: 'high'
          fail-on-findings: 'true'

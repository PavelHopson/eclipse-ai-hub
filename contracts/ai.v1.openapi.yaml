openapi: 3.1.0
info:
  title: Eclipse AI Gateway
  version: 1.0.0
  description: Server-to-server AI contract for Eclipse Forge products.
servers:
  - url: http://127.0.0.1:8810
paths:
  /health:
    get:
      operationId: getGatewayHealth
      responses:
        '200':
          description: Gateway process is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/models:
    get:
      operationId: listAllowedModels
      description: Requires the `models:read` service-client scope.
      security:
        - serviceToken: []
      responses:
        '200':
          description: Models exposed to this deployment.
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { const: list }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object, owned_by]
                      properties:
                        id: { type: string }
                        object: { const: model }
                        owned_by: { const: eclipse-ai-hub }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenScope' }
  /v1/telemetry:
    get:
      operationId: getGatewayTelemetry
      description: Aggregate-only operational telemetry. Prompt, response and user identifiers are never stored.
      x-required-scope: telemetry:read
      security:
        - serviceToken: []
      responses:
        '200':
          description: Rolling SLO windows and aggregate usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenScope' }
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      description: Text and tool-call completion. Streaming is not part of the first ai.v1 slice.
      x-required-scope: chat:write
      security:
        - serviceToken: []
      parameters:
        - in: header
          name: X-Request-Id
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: OpenAI-compatible chat completion.
          headers:
            X-Request-Id: { schema: { type: string } }
            X-Eclipse-Latency-Ms: { schema: { type: integer } }
            X-Eclipse-Upstream: { schema: { const: configured-provider } }
          content:
            application/json:
              schema:
                type: object
                required: [choices]
                properties:
                  id: { type: string }
                  object: { type: string }
                  model: { type: string }
                  choices: { type: array, minItems: 1 }
                  usage: { type: object }
                additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenScope' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/UpstreamFailure' }
        '504': { $ref: '#/components/responses/UpstreamFailure' }
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
  schemas:
    HealthResponse:
      type: object
      required: [ok, service, contract, modelCount]
      properties:
        ok: { const: true }
        service: { const: eclipse-ai-gateway }
        contract: { const: ai.v1 }
        modelCount: { type: integer, minimum: 1 }
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          enum: [system, user, assistant, tool]
        content:
          type: string
          maxLength: 100000
        tool_call_id:
          type: string
          maxLength: 256
        tool_calls:
          type: array
          maxItems: 64
      additionalProperties: false
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, minLength: 1, maxLength: 200 }
        messages:
          type: array
          minItems: 1
          maxItems: 128
          items: { $ref: '#/components/schemas/ChatMessage' }
        temperature: { type: number, minimum: 0, maximum: 2 }
        max_tokens: { type: integer, minimum: 1, maximum: 8192 }
        stream: { const: false }
        tools: { type: array, maxItems: 64 }
        tool_choice:
          oneOf:
            - enum: [auto, none, required]
            - type: object
      additionalProperties: true
    TelemetryWindow:
      type: object
      required: [requests, successes, clientErrors, serviceErrors, availabilityPercent, averageLatencyMs, p95LatencyMs, maxLatencyMs, costUsd, promptTokens, completionTokens, topErrors, slo]
      properties:
        requests: { type: integer, minimum: 0 }
        successes: { type: integer, minimum: 0 }
        clientErrors: { type: integer, minimum: 0 }
        serviceErrors: { type: integer, minimum: 0 }
        availabilityPercent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        averageLatencyMs: { type: [integer, 'null'], minimum: 0 }
        p95LatencyMs: { type: [integer, 'null'], minimum: 0 }
        maxLatencyMs: { type: [integer, 'null'], minimum: 0 }
        costUsd: { type: number, minimum: 0 }
        promptTokens: { type: integer, minimum: 0 }
        completionTokens: { type: integer, minimum: 0 }
        topErrors:
          type: array
          maxItems: 5
          items:
            type: object
            required: [code, count]
            properties:
              code: { type: string }
              count: { type: integer, minimum: 1 }
        slo:
          type: object
          required: [status, availabilityMet, latencyMet]
          properties:
            status: { enum: [healthy, breached, no_data] }
            availabilityMet: { type: [boolean, 'null'] }
            latencyMet: { type: [boolean, 'null'] }
    TelemetryResponse:
      type: object
      required: [generatedAt, retentionHours, persistence, privacy, targets, windows]
      properties:
        generatedAt: { type: string, format: date-time }
        retentionHours: { type: integer, minimum: 24 }
        persistence: { enum: [memory, file] }
        privacy:
          type: object
          required: [aggregation, contentStored, identifiersStored]
          properties:
            aggregation: { const: hourly }
            contentStored: { const: false }
            identifiersStored: { const: false }
        targets:
          type: object
          required: [availabilityPercent, p95LatencyMs]
          properties:
            availabilityPercent: { type: number, minimum: 90, maximum: 100 }
            p95LatencyMs: { type: integer, minimum: 100 }
        windows:
          type: object
          required: [1h, 24h, 7d]
          properties:
            1h: { $ref: '#/components/schemas/TelemetryWindow' }
            24h: { $ref: '#/components/schemas/TelemetryWindow' }
            7d: { $ref: '#/components/schemas/TelemetryWindow' }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    BadRequest:
      description: Invalid or unsupported request.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Missing or invalid service token.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ForbiddenScope:
      description: Authenticated service client does not have the required endpoint scope.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    PayloadTooLarge:
      description: Request exceeds the configured body limit.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    RateLimited:
      description: Service request budget is exhausted for this minute.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UpstreamFailure:
      description: Configured upstream failed or timed out; its response body is not exposed.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

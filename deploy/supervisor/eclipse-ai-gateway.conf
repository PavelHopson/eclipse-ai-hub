[program:eclipse-ai-gateway]
directory=@@DEPLOY_PATH@@
command=@@DEPLOY_PATH@@/deploy/scripts/run-gateway.sh
environment=ECLIPSE_AI_HUB_GATEWAY_PATH="@@DEPLOY_PATH@@",AI_GATEWAY_ENV_FILE="@@ENV_FILE@@"
user=www-data
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/var/log/supervisor/eclipse-ai-gateway.log
stderr_logfile=/var/log/supervisor/eclipse-ai-gateway.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
